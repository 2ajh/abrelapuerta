<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Invitados - Portón</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="explosion" class="explosion"></div>

<div class="card" id="main-card">
    <h1 id="header">BIENVENIDO</h1>
    <div id="status-msg">Introduce tu PIN de acceso</div>

    <!-- PIN -->
    <div id="pin-interface">
        <!-- Indicador GPS -->
        <div id="gps-indicator" class="gps-indicator checking" onclick="requestGPS()">
            ⏳ Comprobando ubicación...
        </div>

        <div id="display"></div>

        <div class="numpad">
            <button class="key" onclick="press(1)">1</button>
            <button class="key" onclick="press(2)">2</button>
            <button class="key" onclick="press(3)">3</button>
            <button class="key" onclick="press(4)">4</button>
            <button class="key" onclick="press(5)">5</button>
            <button class="key" onclick="press(6)">6</button>
            <button class="key" onclick="press(7)">7</button>
            <button class="key" onclick="press(8)">8</button>
            <button class="key" onclick="press(9)">9</button>
            <button class="key clear" onclick="clearPin()">BORRAR</button>
            <button class="key" onclick="press(0)">0</button>
            <button class="key clear" onclick="deleteLast()">⌫</button>
            <button class="key send" id="btn-send" onclick="validate()">ABRIR PORTÓN</button>
        </div>
    </div>

    <!-- Spinner (verificando) -->
    <div id="spinner-box" class="spinner-wrap">
        <div class="spinner"></div>
        <div class="spinner-label" id="spinner-label">VERIFICANDO PIN...</div>
    </div>

    <!-- Animación puerta (apertura y cierre) -->
    <div id="door-box" class="spinner-wrap">
        <div class="spinner-label" id="door-label">ABRIENDO PORTÓN...</div>
        <div class="gate-wrapper" id="gate-wrapper">
            <div id="gate-left"  class="gate-door gate-left"></div>
            <div id="gate-right" class="gate-door gate-right"></div>
        </div>
        <div class="spinner-label" id="door-percent">0%</div>
    </div>

    <!-- Resultado: acceso denegado / error -->
    <div id="result-box">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title">ACCESO DENEGADO</div>
        <div class="result-sub"   id="result-sub">PIN Incorrecto</div>
        <button id="btn-retry" onclick="returnToNumpad()">VOLVER AL TECLADO</button>
    </div>

    <!-- Countdown: acceso concedido -->
    <div id="countdown-box">
        <button class="btn-close" onclick="returnToNumpad()" title="Volver">✕</button>
        <p id="seconds">50</p>
        <p class="cd-label-main">✅ Portón abierto</p>
        <p class="cd-label-sub">
            El portón se cerrará en<br>
            <span id="seconds-inline">50</span> segundos
        </p>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
