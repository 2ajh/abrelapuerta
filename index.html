<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Invitados - Portón</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --primary: #00ff41;
            --danger:  #ff3e3e;
            --warning: #ffaa00;
            --bg:      #0a0a0a;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .card {
            background: #111;
            padding: clamp(1.2rem, 5vw, 2rem);
            border-radius: clamp(1rem, 4vw, 2rem);
            border: 1px solid #333;
            text-align: center;
            width: min(90vw, 360px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        h1 {
            font-size: clamp(0.85rem, 3vw, 1rem);
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 0.8rem 0;
        }

        #status-msg {
            min-height: 1.4rem;
            margin-bottom: 0.8rem;
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            font-weight: bold;
            transition: color 0.3s;
        }

        .error   { color: var(--danger);  animation: shake 0.4s; }
        .success { color: var(--primary); }
        .warning { color: var(--warning); }

        /* ── Display PIN ── */
        #display {
            font-size: clamp(2rem, 10vw, 3rem);
            height: clamp(3.5rem, 14vw, 4.5rem);
            background: #000;
            border-radius: clamp(0.6rem, 3vw, 1rem);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
            letter-spacing: 10px;
            border: 2px solid #222;
        }

        /* ── Numpad ── */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(6px, 2vw, 12px);
        }

        .key {
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: clamp(0.8rem, 3.5vw, 1.2rem) 0;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            border-radius: clamp(0.6rem, 3vw, 1rem);
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            line-height: 1;
        }
        .key:active { background: #333; transform: scale(0.95); }

        .key.send {
            background: var(--primary);
            color: black;
            grid-column: span 3;
            font-weight: 800;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: clamp(0.9rem, 3.5vw, 1.1rem) 0;
        }
        .key.send:disabled { opacity: 0.4; cursor: not-allowed; }

        .key.clear {
            background: #2a2a2a;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: #888;
        }

        /* ── Spinner ── */
        .spinner-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem 0;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #333;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner-label {
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Animación puerta ── */
        .gate-wrapper {
            width: 140px;
            height: 90px;
            background: radial-gradient(circle, rgba(0,255,65,0.4) 0%, #000 80%);
            border: 2px solid #444;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .gate-door {
            width: 50%;
            height: 100%;
            background: #222;
            position: absolute;
            top: 0;
            transition: transform 0.1s linear;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 10px,
                #111 10px,
                #111 14px
            );
            border: 1px solid #555;
            z-index: 2;
        }

        .gate-left  { left: 0;  border-right: 2px solid var(--primary); box-shadow:  2px 0 10px rgba(0,0,0,0.8); }
        .gate-right { right: 0; border-left:  2px solid var(--primary); box-shadow: -2px 0 10px rgba(0,0,0,0.8); }

        /* ── Resultado error ── */
        #result-box {
            display: none;
            padding: 1rem 0 0.5rem;
            position: relative;
        }

        .result-icon {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* X roja CSS puro */
        .result-icon.red::before,
        .result-icon.red::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 8px;
            background-color: var(--danger);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255,62,62,0.6);
        }
        .result-icon.red::before { transform: rotate(45deg); }
        .result-icon.red::after  { transform: rotate(-45deg); }

        /* Círculo exterior animado */
        .result-icon.red {
            animation: popIn 0.4s cubic-bezier(.36,.07,.19,.97) forwards;
        }
        .result-icon.red::before,
        .result-icon.red::after {
            animation: popIn 0.4s cubic-bezier(.36,.07,.19,.97) forwards;
        }

        /* Icono warning para too_far */
        .result-icon.warn::before,
        .result-icon.warn::after { background-color: var(--warning); box-shadow: 0 0 15px rgba(255,170,0,0.6); }
        .result-icon.warn::before { transform: rotate(45deg); }
        .result-icon.warn::after  { transform: rotate(-45deg); }

        /* Icono gris para timeout/error */
        .result-icon.muted::before,
        .result-icon.muted::after { background-color: #555; box-shadow: none; }
        .result-icon.muted::before { transform: rotate(45deg); }
        .result-icon.muted::after  { transform: rotate(-45deg); }

        .result-title {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .result-sub {
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            color: #aaa;
            margin-bottom: 1.5rem;
        }

        #btn-retry {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #aaa;
            padding: 0.8rem 1.4rem;
            border-radius: 0.6rem;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-retry:active { background: #333; }

        /* ── Countdown ── */
        #countdown-box {
            display: none;
            padding: 1.5rem 0 0.5rem;
            position: relative;
        }

        .btn-close {
            position: absolute;
            top: -10px; right: -10px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #888;
            width: 2.5rem; height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            font-size: 1rem;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, color 0.15s;
        }
        .btn-close:active { background: #444; color: white; }

        #seconds {
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 900;
            color: var(--primary);
            margin: 0;
            line-height: 1;
        }

        .cd-label-main {
            color: var(--primary);
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            font-weight: 700;
            margin: 0.5rem 0 0.25rem;
            text-transform: uppercase;
        }

        .cd-label-sub {
            color: #555;
            font-size: clamp(0.62rem, 2.3vw, 0.75rem);
            text-transform: uppercase;
            line-height: 1.6;
        }
        .cd-label-sub span { color: #888; font-weight: 700; }

        /* ── Flash overlay ── */
        .explosion {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }
        .boom-active { animation: flash 1s ease-out forwards; }

        @keyframes flash {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-8px); }
            75%      { transform: translateX(8px); }
        }
        @keyframes popIn {
            0%   { transform: scale(0.4); opacity: 0; }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>

<div id="explosion" class="explosion"></div>

<div class="card" id="main-card">
    <h1 id="header">BIENVENIDO</h1>
    <div id="status-msg">Introduce tu PIN de acceso</div>

    <!-- PIN -->
    <div id="pin-interface">
        <div id="display"></div>
        <div class="numpad">
            <button class="key" onclick="press(1)">1</button>
            <button class="key" onclick="press(2)">2</button>
            <button class="key" onclick="press(3)">3</button>
            <button class="key" onclick="press(4)">4</button>
            <button class="key" onclick="press(5)">5</button>
            <button class="key" onclick="press(6)">6</button>
            <button class="key" onclick="press(7)">7</button>
            <button class="key" onclick="press(8)">8</button>
            <button class="key" onclick="press(9)">9</button>
            <button class="key clear" onclick="clearPin()">BORRAR</button>
            <button class="key" onclick="press(0)">0</button>
            <button class="key clear" onclick="deleteLast()">⌫</button>
            <button class="key send" id="btn-send" onclick="validate()">ABRIR PORTÓN</button>
        </div>
    </div>

    <!-- Spinner (verificando) -->
    <div id="spinner-box" class="spinner-wrap">
        <div class="spinner"></div>
        <div class="spinner-label" id="spinner-label">VERIFICANDO PIN...</div>
    </div>

    <!-- Animación puerta (apertura) -->
    <div id="door-box" class="spinner-wrap">
        <div class="spinner-label">ABRIENDO PORTÓN...</div>
        <div class="gate-wrapper">
            <div id="gate-left"  class="gate-door gate-left"></div>
            <div id="gate-right" class="gate-door gate-right"></div>
        </div>
        <div class="spinner-label" id="door-percent">0%</div>
    </div>

    <!-- Resultado: acceso denegado / error -->
    <div id="result-box">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title">ACCESO DENEGADO</div>
        <div class="result-sub"   id="result-sub">PIN Incorrecto</div>
        <button id="btn-retry" onclick="returnToNumpad()">VOLVER AL TECLADO</button>
    </div>

    <!-- Countdown: acceso concedido -->
    <div id="countdown-box">
        <p id="seconds">50</p>
        <p class="cd-label-main">✅ Portón abierto</p>
        <p class="cd-label-sub">
            El portón se cerrará en<br>
            <span id="seconds-inline">50</span> segundos
        </p>
    </div>
</div>

<script>
    const PROXY_URL = "/api";

    let currentPin     = "";
    let isProcessing   = false;
    let countdownTimer = null;
    let gateInterval   = null;

    // ── Teclado ────────────────────────────────────────────────────────────────
    function press(n) {
        if (isProcessing || currentPin.length >= 6) return;
        currentPin += n;
        updateDisplay();
        resetMsg();
    }
    function clearPin()   { currentPin = ""; updateDisplay(); resetMsg(); }
    function deleteLast() { currentPin = currentPin.slice(0, -1); updateDisplay(); resetMsg(); }
    function resetMsg()   { setMsg("Introduce tu PIN de acceso", ""); }
    function updateDisplay() {
        document.getElementById('display').innerText = "•".repeat(currentPin.length);
    }
    function setMsg(text, cls) {
        const el = document.getElementById('status-msg');
        el.innerText = text;
        el.className = cls;
    }

    // ── Paneles ────────────────────────────────────────────────────────────────
    function showOnly(id) {
        ['pin-interface','spinner-box','door-box','result-box','countdown-box']
            .forEach(boxId => {
                const el = document.getElementById(boxId);
                if (boxId !== id) { el.style.display = 'none'; return; }
                // spinner-wrap usa flex, el resto block
                el.style.display = (boxId === 'spinner-box' || boxId === 'door-box') ? 'flex' : 'block';
            });
    }

    // ── Flujo principal ────────────────────────────────────────────────────────
    async function validate() {
        if (currentPin.length < 4 || isProcessing) return;

        isProcessing = true;
        document.getElementById('btn-send').disabled = true;
        setMsg("OBTENIENDO UBICACIÓN...", "");

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                showOnly('spinner-box');
                setSpinner("ENVIANDO...");
                setMsg("", "");

                let requestId;
                try {
                    const res  = await fetch(`${PROXY_URL}/trigger`, {
                        method:  "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            pin: currentPin,
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok || !data.requestId) { showError("ERROR DE CONEXIÓN", "No se pudo contactar con el servidor"); return; }
                    requestId = data.requestId;
                } catch {
                    showError("ERROR DE CONEXIÓN", "Comprueba tu conexión a internet");
                    return;
                }

                setSpinner("VERIFICANDO PIN...");
                try {
                    const res    = await fetch(`${PROXY_URL}/result/${requestId}`);
                    const result = await res.json();
                    handleResult(result.status);
                } catch {
                    showError("SIN RESPUESTA", "El sistema no respondió a tiempo");
                }
            },
            (err) => {
                if (err.code === 1) setMsg("PERMISO DE GPS DENEGADO", "error");
                else                setMsg("ACTIVA EL GPS", "error");
                resetProcessing();
            },
            { timeout: 8000, maximumAge: 10000 }
        );
    }

    function setSpinner(text) {
        document.getElementById('spinner-label').innerText = text;
    }

    function handleResult(status) {
        switch (status) {
            case "granted":   animarPuerta(); break;
            case "wrong_pin": showError("ACCESO DENEGADO", "PIN incorrecto", "red"); break;
            case "too_far":   showError("DEMASIADO LEJOS", "Debes estar cerca del portón", "warn"); break;
            case "timeout":   showError("SIN RESPUESTA", "El sistema tardó demasiado en responder", "muted"); break;
            default:          showError("ERROR", "Inténtalo de nuevo", "muted");
        }
    }

    // ── Animación puerta ───────────────────────────────────────────────────────
    function animarPuerta() {
        showOnly('door-box');
        document.getElementById('header').innerText = "PROCESANDO";
        setMsg("", "");

        let progress = 0;
        const gateLeft   = document.getElementById('gate-left');
        const gateRight  = document.getElementById('gate-right');
        const percentText = document.getElementById('door-percent');

        gateLeft.style.transform  = 'translateX(0%)';
        gateRight.style.transform = 'translateX(0%)';
        percentText.innerText = "0%";

        gateInterval = setInterval(() => {
            progress++;
            gateLeft.style.transform  = `translateX(-${progress}%)`;
            gateRight.style.transform = `translateX(${progress}%)`;
            percentText.innerText = progress + "%";

            if (progress >= 100) {
                clearInterval(gateInterval);
                gateInterval = null;
                setTimeout(() => iniciarCuentaAtras(), 400);
            }
        }, 100); // 25ms × 100 = 2.5 s de animación
    }

    // ── Error ──────────────────────────────────────────────────────────────────
    function showError(title, sub, iconClass = "red") {
        document.getElementById('header').innerText       = title === "ACCESO DENEGADO" ? "ACCESO DENEGADO" : "ERROR";
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-title').style.color = iconClass === "red"  ? "var(--danger)"  :
                                                               iconClass === "warn" ? "var(--warning)" : "#555";
        document.getElementById('result-sub').innerText   = sub;

        // Reinicia animación del icono
        const icon = document.getElementById('result-icon');
        icon.className = 'result-icon';
        void icon.offsetWidth;
        icon.className = `result-icon ${iconClass}`;

        showOnly('result-box');
        setMsg("", "");
        // isProcessing queda true — el usuario debe pulsar "Volver al teclado"
    }

    // ── Countdown ─────────────────────────────────────────────────────────────
    function iniciarCuentaAtras() {
        document.getElementById('header').innerText = "ACCESO CONCEDIDO";
        setMsg("PORTÓN ABIERTO", "success");
        showOnly('countdown-box');

        const cd       = document.getElementById('seconds');
        const cdInline = document.getElementById('seconds-inline');
        let seconds    = 50;
        cd.innerText = cdInline.innerText = seconds;

        countdownTimer = setInterval(() => {
            seconds--;
            cd.innerText = cdInline.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                document.getElementById('explosion').classList.add('boom-active');
                setTimeout(() => returnToNumpad(), 1200);
            }
        }, 1000);
    }

    // ── Volver al numpad ───────────────────────────────────────────────────────
    function returnToNumpad() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        if (gateInterval)   { clearInterval(gateInterval);   gateInterval = null; }

        document.getElementById('explosion').classList.remove('boom-active');
        document.getElementById('gate-left').style.transform  = 'translateX(0%)';
        document.getElementById('gate-right').style.transform = 'translateX(0%)';
        document.getElementById('door-percent').innerText = "0%";

        currentPin = "";
        document.getElementById('header').innerText = "BIENVENIDO";
        resetProcessing();
        showOnly('pin-interface');
        updateDisplay();
        resetMsg();
    }

    function resetProcessing() {
        isProcessing = false;
        document.getElementById('btn-send').disabled = false;
    }
</script>
</body>
</html>
