<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[TEST] Portón</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* ── Banner test ── */
        #test-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--warning);
            color: #000;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 5px 0;
            z-index: 1000;
            text-transform: uppercase;
        }

        body { padding-top: 1.8rem; }

        /* ── Botones de test ── */
        .test-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(8px, 2vw, 12px);
            margin-top: 0.5rem;
        }

        .test-btn {
            padding: clamp(1rem, 4vw, 1.3rem) 0;
            border-radius: clamp(0.6rem, 3vw, 1rem);
            border: 1px solid;
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .test-btn:active { opacity: 0.7; transform: scale(0.97); }

        .test-btn.ok      { background: #001a08; border-color: var(--primary); color: var(--primary); }
        .test-btn.fail    { background: #1a0000; border-color: var(--danger);  color: var(--danger);  }
        .test-btn.timeout { background: #111;    border-color: #444;           color: #666;           }

        .test-hint {
            font-size: clamp(0.6rem, 2vw, 0.7rem);
            color: #444;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>

<div id="test-banner">⚠️ MODO TEST — Sin GPS ni servidor</div>
<div id="explosion" class="explosion"></div>

<div class="card">
    <h1 id="header">BIENVENIDO</h1>
    <div id="status-msg">Selecciona un escenario</div>

    <!-- Botones de test -->
    <div id="pin-interface">
        <p class="test-hint">Simular resultado:</p>
        <div class="test-grid">
            <button class="test-btn ok"      onclick="simular('granted')">✅ PIN correcto</button>
            <button class="test-btn fail"    onclick="simular('wrong_pin')">🚫 PIN incorrecto</button>
            <button class="test-btn timeout" onclick="simular('timeout')">⏱ Sin respuesta</button>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner-box" class="spinner-wrap">
        <div class="spinner"></div>
        <div class="spinner-label" id="spinner-label">VERIFICANDO PIN...</div>
    </div>

    <!-- Animación puerta -->
    <div id="door-box" class="spinner-wrap">
        <div class="spinner-label" id="door-label">ABRIENDO PORTÓN...</div>
        <div class="gate-wrapper" id="gate-wrapper">
            <div id="gate-left"  class="gate-door gate-left"></div>
            <div id="gate-right" class="gate-door gate-right"></div>
        </div>
        <div class="spinner-label" id="door-percent">0%</div>
    </div>

    <!-- Resultado -->
    <div id="result-box">
        <div class="result-icon" id="result-icon"></div>
        <div class="result-title" id="result-title"></div>
        <div class="result-sub"   id="result-sub"></div>
        <button id="btn-retry" onclick="returnToNumpad()">VOLVER AL TECLADO</button>
    </div>

    <!-- Countdown -->
    <div id="countdown-box">
        <button class="btn-close" onclick="returnToNumpad()" title="Volver">✕</button>
        <p id="seconds">10</p>
        <p class="cd-label-main">✅ Portón abierto</p>
        <p class="cd-label-sub">
            El portón se cerrará en<br>
            <span id="seconds-inline">10</span> segundos
        </p>
    </div>
</div>

<script>
    let countdownTimer = null;
    let gateInterval   = null;

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function simular(status) {
        showOnly('spinner-box');
        setMsg("", "");
        document.getElementById('spinner-label').innerText = "VERIFICANDO PIN...";
        await sleep(800);
        handleResult(status);
    }

    function handleResult(status) {
        switch (status) {
            case "granted":   animarApertura(); break;
            case "wrong_pin": showError("ACCESO DENEGADO",  "PIN incorrecto",                           "red");   break;
            case "too_far":   showError("DEMASIADO LEJOS",  "Debes estar cerca del portón para abrirlo", "warn");  break;
            case "timeout":   showError("SIN RESPUESTA",    "El sistema tardó demasiado en responder",   "muted"); break;
            default:          showError("ERROR",             "Inténtalo de nuevo",                        "muted"); break;
        }
    }

    function animarApertura() {
        const wrapper = document.getElementById('gate-wrapper');
        wrapper.classList.remove('closing');
        document.getElementById('door-label').innerText = "ABRIENDO PORTÓN...";
        document.getElementById('header').innerText = "PROCESANDO";
        showOnly('door-box');

        let progress = 0;
        const gateLeft    = document.getElementById('gate-left');
        const gateRight   = document.getElementById('gate-right');
        const percentText = document.getElementById('door-percent');
        gateLeft.style.transform  = 'translateX(0%)';
        gateRight.style.transform = 'translateX(0%)';
        percentText.innerText = "0%";

        gateInterval = setInterval(() => {
            progress++;
            gateLeft.style.transform  = `translateX(-${progress}%)`;
            gateRight.style.transform = `translateX(${progress}%)`;
            percentText.innerText = progress + "%";
            if (progress >= 100) {
                clearInterval(gateInterval);
                gateInterval = null;
                setTimeout(() => iniciarCuentaAtras(), 400);
            }
        }, 100);
    }

    function animarCierre(callback) {
        const wrapper = document.getElementById('gate-wrapper');
        wrapper.classList.add('closing');
        document.getElementById('door-label').innerText = "CERRANDO PORTÓN...";
        document.getElementById('header').innerText = "CERRANDO";
        showOnly('door-box');

        let progress = 100;
        const gateLeft    = document.getElementById('gate-left');
        const gateRight   = document.getElementById('gate-right');
        const percentText = document.getElementById('door-percent');
        gateLeft.style.transform  = 'translateX(-100%)';
        gateRight.style.transform = 'translateX(100%)';
        percentText.innerText = "100%";

        gateInterval = setInterval(() => {
            progress--;
            gateLeft.style.transform  = `translateX(-${progress}%)`;
            gateRight.style.transform = `translateX(${progress}%)`;
            percentText.innerText = progress + "%";
            if (progress <= 0) {
                clearInterval(gateInterval);
                gateInterval = null;
                setTimeout(() => {
                    document.getElementById('explosion').classList.add('boom-active');
                    setTimeout(() => callback(), 1200);
                }, 300);
            }
        }, 100);
    }

    function showError(title, sub, iconClass = "red") {
        document.getElementById('header').innerText        = title === "ACCESO DENEGADO" ? "ACCESO DENEGADO" : "ERROR";
        document.getElementById('result-title').innerText  = title;
        document.getElementById('result-title').style.color =
            iconClass === "red"  ? "var(--danger)"  :
            iconClass === "warn" ? "var(--warning)" : "#555";
        document.getElementById('result-sub').innerText = sub;

        const icon = document.getElementById('result-icon');
        icon.className = 'result-icon';
        void icon.offsetWidth;
        icon.className = `result-icon ${iconClass}`;

        showOnly('result-box');
        setMsg("", "");
    }

    function iniciarCuentaAtras() {
        document.getElementById('header').innerText = "ACCESO CONCEDIDO";
        setMsg("PORTÓN ABIERTO", "success");
        showOnly('countdown-box');

        const cd       = document.getElementById('seconds');
        const cdInline = document.getElementById('seconds-inline');
        let seconds    = 50;
        cd.innerText = cdInline.innerText = seconds;

        countdownTimer = setInterval(() => {
            seconds--;
            cd.innerText = cdInline.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                animarCierre(() => returnToNumpad());
            }
        }, 1000);
    }

    function returnToNumpad() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        if (gateInterval)   { clearInterval(gateInterval);   gateInterval = null; }

        document.getElementById('explosion').classList.remove('boom-active');
        document.getElementById('gate-left').style.transform  = 'translateX(0%)';
        document.getElementById('gate-right').style.transform = 'translateX(0%)';
        document.getElementById('door-percent').innerText = "0%";
        document.getElementById('gate-wrapper').classList.remove('closing');
        document.getElementById('header').innerText = "BIENVENIDO";
        setMsg("Selecciona un escenario", "");
        showOnly('pin-interface');
    }

    function showOnly(id) {
        ['pin-interface','spinner-box','door-box','result-box','countdown-box']
            .forEach(boxId => {
                const el = document.getElementById(boxId);
                if (boxId !== id) { el.style.display = 'none'; return; }
                el.style.display = (boxId === 'spinner-box' || boxId === 'door-box') ? 'flex' : 'block';
            });
    }

    function setMsg(text, cls) {
        const el = document.getElementById('status-msg');
        el.innerText = text;
        el.className = cls;
    }
</script>
</body>
</html>
